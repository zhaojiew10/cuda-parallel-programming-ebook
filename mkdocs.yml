site_name: CUDA 并行编程
site_description: Mastering Parallel Programming with CUDA Platform：83 讲精编为 26 章
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - toc.follow
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.code.annotate
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: 切换到深色模式
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: 切换到浅色模式
plugins:
- search:
    lang:
    - en
    - zh
markdown_extensions:
- admonition
- attr_list
- def_list
- md_in_html
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.details
- pymdownx.arithmatex:
    generic: true
extra_css:
- resources/style.css
extra_javascript:
- javascripts/mathjax.js
- javascripts/tex-mml-chtml.min.js
nav:
- 电子书首页: index.md
- 阅读与实践指南: guide.md
- 第一部分 · 并行计算思维与 CUDA 程序骨架:
  - 第 1 章 并行计算与 CUDA 入门: chapters/ch01.md
  - 第 2 章 配置环境并运行第一个 CUDA 程序: chapters/ch02.md
  - 第 3 章 用网格和线程块定位数据: chapters/ch03.md
  - 第 4 章 全局索引与边界检查: chapters/ch04.md
  - 第 5 章 完成一次向量加法: chapters/ch05.md
  - 第 6 章 验证结果并处理 CUDA 错误: chapters/ch06.md
  - 第 7 章 计时并查询设备能力: chapters/ch07.md
- 第二部分 · GPU 执行模型与归约优化:
  - 第 8 章 理解 SM、Warp 与线程执行: chapters/ch08.md
  - 第 9 章 Warp 分化与占用率: chapters/ch09.md
  - 第 10 章 实现并行归约: chapters/ch10.md
  - 第 11 章 优化归约：展开与 Shuffle: chapters/ch11.md
  - 第 12 章 在设备端启动核函数: chapters/ch12.md
- 第三部分 · 内存层次、全局访问与片上优化:
  - 第 13 章 管理主机与设备之间的数据: chapters/ch13.md
  - 第 14 章 让全局内存访问更连续: chapters/ch14.md
  - 第 15 章 实现并优化矩阵转置: chapters/ch15.md
  - 第 16 章 理解共享内存与 Bank 冲突: chapters/ch16.md
  - 第 17 章 用共享内存完成块内归约: chapters/ch17.md
  - 第 18 章 用共享内存优化矩阵转置: chapters/ch18.md
  - 第 19 章 用 Shuffle 完成分层归约: chapters/ch19.md
- 第四部分 · 异步流水线：流、事件与依赖:
  - 第 20 章 用 CUDA 流重叠传输与计算: chapters/ch20.md
  - 第 21 章 用事件管理异步依赖: chapters/ch21.md
- 第五部分 · 数值、原子操作与扫描:
  - 第 22 章 处理浮点误差与并发更新: chapters/ch22.md
  - 第 23 章 实现块内并行扫描: chapters/ch23.md
  - 第 24 章 扩展到跨块扫描与流压缩: chapters/ch24.md
- 第六部分 · CUDA 图像处理基础与 OpenCV 环境:
  - 第 25 章 用 CUDA 处理图像像素: chapters/ch25.md
  - 第 26 章 理解图像并配置 OpenCV 环境: chapters/ch26.md
- CUDA 术语表: glossary.md
site_url: https://zhaojiew10.github.io/cuda-parallel-programming-ebook/
repo_url: https://github.com/zhaojiew10/cuda-parallel-programming-ebook
edit_uri: edit/main/docs/
