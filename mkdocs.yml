site_name: CUDA 并行编程：课程精编教程
site_description: Mastering Parallel Programming with CUDA Platform：83 讲精编为 26 章
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - toc.follow
  - search.highlight
  - search.suggest
  - content.code.copy
  - content.code.annotate
  palette:
  - scheme: default
    primary: blue grey
    accent: cyan
plugins:
- search:
    lang:
    - en
    - zh
markdown_extensions:
- admonition
- attr_list
- def_list
- md_in_html
- tables
- toc:
    permalink: true
    toc_depth: 3
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.superfences
- pymdownx.details
extra_css:
- resources/style.css
