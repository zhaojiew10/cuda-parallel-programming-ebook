<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title-thread-hierarchy desc-thread-hierarchy">
<title id="title-thread-hierarchy">网格 → 线程块 → 线程：逐层定位</title>
<desc id="desc-thread-hierarchy">展示 CUDA 网格、线程块与线程的三层组织，并用 blockIdx、blockDim 与 threadIdx 建立一维全局索引。</desc>
<defs>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7C"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B68"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D98818"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C94F55"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7556B3"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168C8C"/></marker>
</defs>
<rect width="1200" height="800" fill="#F6F8FC"/>
<rect width="1200" height="8" fill="#2F6FED"/>
<text x="60" y="46" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="start" >第 3 章 · 网格、线程块与线程索引</text>
<text x="60" y="92" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" >网格 → 线程块 → 线程：逐层定位</text>
<text x="60" y="126" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="start" >块坐标确定数据区间，块内坐标确定元素偏移</text>
<rect x="60" y="160" width="1080" height="180" rx="14" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<rect x="84" y="178" width="110" height="32" rx="16" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="139.0" y="200" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >网格 Grid</text>
<text x="1130" y="200" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="400" fill="#5B6B7C" text-anchor="end" >gridDim 描述块网格形状</text>
<rect x="90" y="225" width="235" height="88" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.3" />
<text x="108" y="254" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="start" >线程块 0</text>
<text x="108" y="283" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >blockIdx.x = 0</text>
<rect x="355" y="225" width="235" height="88" rx="12" fill="#FFF3DE" stroke="#D98818" stroke-width="2" />
<text x="373" y="254" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="start" >线程块 1</text>
<text x="373" y="283" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >blockIdx.x = 1</text>
<rect x="620" y="225" width="235" height="88" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.3" />
<text x="638" y="254" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="start" >线程块 2</text>
<text x="638" y="283" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >blockIdx.x = 2</text>
<rect x="885" y="225" width="235" height="88" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.3" />
<text x="903" y="254" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="start" >线程块 3</text>
<text x="903" y="283" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >blockIdx.x = 3</text>
<path d="M 502 313 L 502 350 L 600 350 L 600 380" fill="none" stroke="#D98818" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
<text x="520" y="344" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#D98818" text-anchor="start" >展开选中的块</text>
<rect x="170" y="380" width="860" height="138" rx="14" fill="#FFFFFF" stroke="#D98818" stroke-width="1.4" />
<rect x="190" y="396" width="185" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="282.5" y="418" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="600" fill="#D98818" text-anchor="middle" >块内 threadIdx.x</text>
<text x="1005" y="418" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="end" >blockDim.x = 8</text>
<rect x="195" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="234.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t0</text>
<rect x="295" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="334.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t1</text>
<rect x="395" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="434.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t2</text>
<rect x="495" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="534.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t3</text>
<rect x="595" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="634.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t4</text>
<rect x="695" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="734.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t5</text>
<rect x="795" y="445" width="78" height="48" rx="7" fill="#E8F5EE" stroke="#2E8B68" stroke-width="1.2" />
<text x="834.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#2E8B68" text-anchor="middle" >t6</text>
<rect x="895" y="445" width="78" height="48" rx="7" fill="#EEF2F6" stroke="#CBD6E2" stroke-width="1.2" />
<text x="934.0" y="474.6" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6B7C" text-anchor="middle" >t7</text>
<path d="M 834 493 L 834 535 L 600 535 L 600 567" fill="none" stroke="#2E8B68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<text x="852" y="529" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#2E8B68" text-anchor="start" >选中 t6</text>
<rect x="180" y="568" width="840" height="92" rx="14" fill="#E8F5EE" stroke="#2E8B68" stroke-width="1.4" />
<text x="600" y="602" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="17" font-weight="700" fill="#2E8B68" text-anchor="middle" >全局下标 = 块起点 + 块内偏移</text>
<text x="600" y="634" font-family="Consolas,'Liberation Mono',monospace" font-size="19" font-weight="600" fill="#17324D" text-anchor="middle" >index = blockIdx.x × blockDim.x + threadIdx.x</text>
<text x="600" y="690" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="middle" >threadIdx 只在各自块内唯一；跨块定位必须结合 blockIdx。</text>
<line x1="60" y1="738" x2="1140" y2="738" stroke="#CBD6E2" stroke-width="1.3" stroke-linecap="round"/>
<text x="60" y="773" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6B7C" text-anchor="start" >图例</text>
<rect x="125" y="757" width="16" height="16" rx="4" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="149" y="771" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >网格与线程块</text>
<rect x="273" y="757" width="16" height="16" rx="4" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="297" y="771" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >当前线程块</text>
<rect x="406" y="757" width="16" height="16" rx="4" fill="#E8F5EE" stroke="none" stroke-width="0" />
<text x="430" y="771" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >选中线程与全局映射</text>
</svg>
