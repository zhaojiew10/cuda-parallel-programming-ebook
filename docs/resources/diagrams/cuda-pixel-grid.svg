<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">一个线程负责一个像素</title>
  <desc id="desc">4列3行灰度图放入4乘4线程块。前3行的12个线程处理有效像素，第3行的4个线程因y等于3超出图像高度而直接返回。高亮线程(2,1)把70反相为185。</desc>
  <defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:31px;font-weight:700;fill:#17324D}.subtitle{font-size:17px;fill:#5B6B7C}.cell-value{font-size:23px;font-weight:700;text-anchor:middle;fill:#17324D}.cell-thread{font-family:Consolas,monospace;font-size:13px;text-anchor:middle;fill:#5B6B7C}.axis{font-size:15px;fill:#5B6B7C}.note{font-size:18px;font-weight:600;fill:#17324D}.small{font-size:14px;fill:#5B6B7C}</style></defs>
  <rect width="1200" height="720" fill="#F6F8FC"/><rect width="1200" height="7" fill="#2F6FED"/>
  <text x="50" y="55" class="title">一个线程负责一个像素</text>
  <text x="50" y="90" class="subtitle">4×3 图像放入一个 4×4 线程块：12 个有效线程，4 个越界线程</text>
  <text x="305" y="140" class="axis" text-anchor="middle">x = 0</text><text x="485" y="140" class="axis" text-anchor="middle">x = 1</text><text x="665" y="140" class="axis" text-anchor="middle">x = 2</text><text x="845" y="140" class="axis" text-anchor="middle">x = 3</text>
  <text x="160" y="205" class="axis">y = 0</text><text x="160" y="315" class="axis">y = 1</text><text x="160" y="425" class="axis">y = 2</text><text x="160" y="535" class="axis">y = 3</text>
  <g stroke="#94A3B8" stroke-width="1.4">
    <rect x="215" y="160" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="395" y="160" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="575" y="160" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="755" y="160" width="180" height="90" rx="10" fill="#EAF1FF"/>
    <rect x="215" y="270" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="395" y="270" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="575" y="270" width="180" height="90" rx="10" fill="#FFF3DE" stroke="#D98818" stroke-width="3"/><rect x="755" y="270" width="180" height="90" rx="10" fill="#EAF1FF"/>
    <rect x="215" y="380" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="395" y="380" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="575" y="380" width="180" height="90" rx="10" fill="#EAF1FF"/><rect x="755" y="380" width="180" height="90" rx="10" fill="#EAF1FF"/>
    <rect x="215" y="490" width="180" height="90" rx="10" fill="#EEF2F6"/><rect x="395" y="490" width="180" height="90" rx="10" fill="#EEF2F6"/><rect x="575" y="490" width="180" height="90" rx="10" fill="#EEF2F6"/><rect x="755" y="490" width="180" height="90" rx="10" fill="#EEF2F6"/>
  </g>
  <g class="cell-value"><text x="305" y="202">10 → 245</text><text x="485" y="202">20 → 235</text><text x="665" y="202">30 → 225</text><text x="845" y="202">40 → 215</text><text x="305" y="312">50 → 205</text><text x="485" y="312">60 → 195</text><text x="665" y="312" fill="#C4750E">70 → 185</text><text x="845" y="312">80 → 175</text><text x="305" y="422">90 → 165</text><text x="485" y="422">100 → 155</text><text x="665" y="422">110 → 145</text><text x="845" y="422">120 → 135</text></g>
  <g class="cell-thread"><text x="305" y="230">线程 (0,0)</text><text x="485" y="230">线程 (1,0)</text><text x="665" y="230">线程 (2,0)</text><text x="845" y="230">线程 (3,0)</text><text x="305" y="340">线程 (0,1)</text><text x="485" y="340">线程 (1,1)</text><text x="665" y="340">线程 (2,1)</text><text x="845" y="340">线程 (3,1)</text><text x="305" y="450">线程 (0,2)</text><text x="485" y="450">线程 (1,2)</text><text x="665" y="450">线程 (2,2)</text><text x="845" y="450">线程 (3,2)</text><text x="305" y="540">越界返回</text><text x="485" y="540">越界返回</text><text x="665" y="540">越界返回</text><text x="845" y="540">越界返回</text></g>
  <rect x="215" y="610" width="340" height="58" rx="12" fill="#E8F5EE"/><text x="385" y="647" class="note" text-anchor="middle">前 3 行：处理 12 个像素</text>
  <rect x="575" y="610" width="360" height="58" rx="12" fill="#EEF2F6"/><text x="755" y="647" class="note" text-anchor="middle">y = 3：4 个线程直接返回</text>
</svg>
