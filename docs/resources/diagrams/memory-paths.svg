<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">三种内存策略的真实数据路径</title>
  <desc id="desc">显式复制在主机缓冲区与设备缓冲区之间进行 H2D 或 D2H 复制，核函数访问设备副本。映射零拷贝让核函数通过主机设备互连直接访问映射页锁定内存，不建立独立设备数组副本。统一内存让 CPU 和 GPU 使用同一托管指针，运行时和硬件按平台机制管理数据位置与一致性。三种方式都需要关注同步与实际数据移动成本。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D98818"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7556B3"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #17324D; }
      .subtitle { font-size: 17px; fill: #5B6B7C; }
      .strategy { font-size: 24px; font-weight: 700; }
      .api { font-family: Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #5B6B7C; }
      .suitable { font-size: 14px; font-weight: 600; fill: #5B6B7C; }
      .box-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .box-note { font-size: 13px; fill: #5B6B7C; text-anchor: middle; }
      .arrow-label { font-size: 13px; font-weight: 600; text-anchor: middle; }
      .explanation { font-size: 16px; font-weight: 600; fill: #17324D; }
      .warning { font-size: 14px; fill: #5B6B7C; }
      .footer { font-size: 16px; font-weight: 600; fill: #17324D; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="850" fill="#F6F8FC"/>
  <rect width="1200" height="7" fill="#2F6FED"/>
  <text x="50" y="56" class="title">三种内存策略：看清数据实际走的路径</text>
  <text x="50" y="91" class="subtitle">核函数可以相同，但缓冲区位置、数据移动方式和成本并不相同</text>

  <!-- ① 显式复制 -->
  <rect x="50" y="130" width="1100" height="195" rx="16" fill="#FFFFFF" stroke="#A9C2F7" stroke-width="1.5"/>
  <rect x="50" y="130" width="235" height="195" rx="16" fill="#EAF1FF"/>
  <line x1="285" y1="153" x2="285" y2="302" stroke="#A9C2F7" stroke-width="1.3"/>
  <text x="80" y="178" class="strategy" fill="#2F6FED">① 显式复制</text>
  <text x="80" y="211" class="api">cudaMalloc</text>
  <text x="80" y="235" class="api">cudaMemcpy / Async</text>
  <text x="80" y="278" class="suitable">适合：设备端重复使用</text>

  <rect x="325" y="168" width="180" height="82" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.6"/>
  <text x="415" y="202" class="box-title" fill="#2F6FED">CPU 主机缓冲</text>
  <text x="415" y="229" class="box-note">hA、hB、hC</text>
  <line x1="515" y1="209" x2="655" y2="209" stroke="#2F6FED" stroke-width="2.8" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="585" y="187" class="arrow-label" fill="#2F6FED">显式复制</text>
  <text x="585" y="236" class="arrow-label" fill="#2F6FED">H2D / D2H</text>
  <rect x="665" y="168" width="180" height="82" rx="12" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.6"/>
  <text x="755" y="202" class="box-title" fill="#2F6FED">GPU 设备缓冲</text>
  <text x="755" y="229" class="box-note">dA、dB、dC</text>
  <line x1="855" y1="209" x2="965" y2="209" stroke="#2F6FED" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <text x="910" y="187" class="arrow-label" fill="#2F6FED">设备内访问</text>
  <rect x="975" y="168" width="140" height="82" rx="12" fill="#17324D"/>
  <text x="1045" y="202" class="box-title" fill="#FFFFFF">核函数</text>
  <text x="1045" y="229" class="box-note" fill="#D9E6F5">读写设备副本</text>
  <text x="325" y="285" class="explanation">主机和设备各有一份缓冲区；数据复制由程序明确发起。</text>
  <text x="325" y="309" class="warning">设备副本可被后续核函数反复使用，但要付出显式传输成本。</text>

  <!-- ② 映射零拷贝 -->
  <rect x="50" y="345" width="1100" height="195" rx="16" fill="#FFFFFF" stroke="#E7BD79" stroke-width="1.5"/>
  <rect x="50" y="345" width="235" height="195" rx="16" fill="#FFF3DE"/>
  <line x1="285" y1="368" x2="285" y2="517" stroke="#E7BD79" stroke-width="1.3"/>
  <text x="80" y="393" class="strategy" fill="#C4750E">② 映射零拷贝</text>
  <text x="80" y="426" class="api">cudaHostAllocMapped</text>
  <text x="80" y="450" class="api">cudaHostGetDevicePointer</text>
  <text x="80" y="493" class="suitable">适合：单次或少量访问</text>

  <rect x="325" y="383" width="215" height="82" rx="12" fill="#FFF3DE" stroke="#D98818" stroke-width="1.6"/>
  <text x="432.5" y="417" class="box-title" fill="#C4750E">映射页锁定内存</text>
  <text x="432.5" y="444" class="box-note">数据驻留在主机侧</text>
  <line x1="550" y1="424" x2="645" y2="424" stroke="#D98818" stroke-width="2.8" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <rect x="655" y="383" width="190" height="82" rx="12" fill="#FFFFFF" stroke="#D98818" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="750" y="417" class="box-title" fill="#C4750E">主机—设备互连</text>
  <text x="750" y="444" class="box-note">实际传输仍会发生</text>
  <line x1="855" y1="424" x2="965" y2="424" stroke="#D98818" stroke-width="2.8" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="910" y="402" class="arrow-label" fill="#C4750E">直接读写</text>
  <rect x="975" y="383" width="140" height="82" rx="12" fill="#17324D"/>
  <text x="1045" y="417" class="box-title" fill="#FFFFFF">核函数</text>
  <text x="1045" y="444" class="box-note" fill="#D9E6F5">使用映射指针</text>
  <text x="325" y="500" class="explanation">不建立独立的设备数组副本，也不调用单独的数组复制。</text>
  <text x="325" y="524" class="warning">“零拷贝”不等于“零传输”：设备访问仍要经过互连。</text>

  <!-- ③ 统一内存 -->
  <rect x="50" y="560" width="1100" height="200" rx="16" fill="#FFFFFF" stroke="#C4B1E3" stroke-width="1.5"/>
  <rect x="50" y="560" width="235" height="200" rx="16" fill="#F1ECFA"/>
  <line x1="285" y1="583" x2="285" y2="737" stroke="#C4B1E3" stroke-width="1.3"/>
  <text x="80" y="608" class="strategy" fill="#7556B3">③ 统一内存</text>
  <text x="80" y="641" class="api">cudaMallocManaged</text>
  <text x="80" y="665" class="api">cudaFree</text>
  <text x="80" y="708" class="suitable">适合：共享指针与渐进迁移</text>

  <rect x="325" y="598" width="180" height="82" rx="12" fill="#FFFFFF" stroke="#7556B3" stroke-width="1.6"/>
  <text x="415" y="632" class="box-title" fill="#7556B3">CPU 访问</text>
  <text x="415" y="659" class="box-note">使用托管指针</text>
  <line x1="515" y1="639" x2="645" y2="639" stroke="#7556B3" stroke-width="2.8" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="580" y="617" class="arrow-label" fill="#7556B3">同一指针</text>
  <rect x="655" y="598" width="210" height="82" rx="12" fill="#F1ECFA" stroke="#7556B3" stroke-width="1.8"/>
  <text x="760" y="632" class="box-title" fill="#7556B3">托管分配</text>
  <text x="760" y="659" class="box-note">统一逻辑地址视图</text>
  <line x1="875" y1="639" x2="965" y2="639" stroke="#7556B3" stroke-width="2.8" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="920" y="617" class="arrow-label" fill="#7556B3">同一指针</text>
  <rect x="975" y="598" width="140" height="82" rx="12" fill="#17324D"/>
  <text x="1045" y="632" class="box-title" fill="#FFFFFF">GPU 访问</text>
  <text x="1045" y="659" class="box-note" fill="#D9E6F5">使用同一指针</text>
  <text x="325" y="715" class="explanation">系统按平台机制管理数据位置与一致性，可能发生页面迁移。</text>
  <text x="325" y="739" class="warning">同一指针不保证数据已在访问者本地，也不代表访问成本相同。</text>

  <rect x="50" y="785" width="1100" height="45" rx="12" fill="#EEF2F6"/>
  <text x="600" y="814" class="footer">三者都不能省略必要的同步；比较时应计入复制、互连访问、页面迁移和等待成本。</text>
</svg>
