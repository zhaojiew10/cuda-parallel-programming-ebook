<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">空间采样与混叠</title>
  <desc id="desc">同一组黑白细条纹分别经过稀疏采样和密集采样。稀疏采样只在部分位置取值，重建后条纹变宽并产生混叠；密集采样则保留原来的细条纹。</desc>
  <defs>
    <pattern id="fine-stripes" width="80" height="60" patternUnits="userSpaceOnUse"><rect width="80" height="60" fill="#F6F8FC"/><rect width="40" height="60" fill="#17324D"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#17324D}.subtitle{font-size:16px;fill:#5B6B7C}.panel-title{font-size:20px;font-weight:700;fill:#17324D}.label{font-size:15px;fill:#5B6B7C}.small{font-size:13px;fill:#5B6B7C}.note{font-size:16px;font-weight:600;fill:#17324D}.alias{fill:#C4750E}.good{fill:#2E8B68}</style>
  </defs>
  <rect width="1200" height="740" fill="#F6F8FC"/><rect width="1200" height="7" fill="#2F6FED"/>
  <text x="50" y="55" class="title">空间采样：采样间隔如何改变条纹</text>
  <text x="50" y="88" class="subtitle">同一组细条纹，分别进行稀疏采样与密集采样</text>

  <rect x="50" y="120" width="1100" height="150" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="80" y="158" class="panel-title">原始细条纹</text>
  <rect x="150" y="180" width="900" height="60" fill="url(#fine-stripes)" stroke="#94A3B8"/>
  <text x="150" y="258" class="small">黑白交替的窄条纹（原图）</text>

  <rect x="50" y="295" width="525" height="340" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="80" y="335" class="panel-title alias">稀疏采样：每隔 3 个条纹取一次值</text>
  <rect x="80" y="360" width="480" height="60" fill="url(#fine-stripes)" stroke="#94A3B8"/>
  <g fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"><circle cx="100" cy="390" r="8"/><circle cx="220" cy="390" r="8"/><circle cx="340" cy="390" r="8"/><circle cx="460" cy="390" r="8"/></g>
  <g class="small" text-anchor="middle"><text x="100" y="448">黑</text><text x="220" y="448">白</text><text x="340" y="448">黑</text><text x="460" y="448">白</text></g>
  <path d="M320 465 L320 492" stroke="#2F6FED" stroke-width="2.3" marker-end="url(#arrow)"/>
  <g stroke="#94A3B8" stroke-width="1.2"><rect x="80" y="510" width="120" height="60" fill="#17324D"/><rect x="200" y="510" width="120" height="60" fill="#F6F8FC"/><rect x="320" y="510" width="120" height="60" fill="#17324D"/><rect x="440" y="510" width="120" height="60" fill="#F6F8FC"/></g>
  <text x="80" y="605" class="note alias">重建结果：细条纹被误读成宽条纹（混叠）</text>

  <rect x="625" y="295" width="525" height="340" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="655" y="335" class="panel-title good">密集采样：每个条纹都取值</text>
  <rect x="655" y="360" width="480" height="60" fill="url(#fine-stripes)" stroke="#94A3B8"/>
  <g fill="#2F6FED" stroke="#FFFFFF" stroke-width="1.5"><circle cx="675" cy="390" r="6"/><circle cx="715" cy="390" r="6"/><circle cx="755" cy="390" r="6"/><circle cx="795" cy="390" r="6"/><circle cx="835" cy="390" r="6"/><circle cx="875" cy="390" r="6"/><circle cx="915" cy="390" r="6"/><circle cx="955" cy="390" r="6"/><circle cx="995" cy="390" r="6"/><circle cx="1035" cy="390" r="6"/><circle cx="1075" cy="390" r="6"/><circle cx="1115" cy="390" r="6"/></g>
  <text x="655" y="448" class="small">采样位置覆盖每个条纹中心</text>
  <path d="M895 465 L895 492" stroke="#2F6FED" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="655" y="510" width="480" height="60" fill="url(#fine-stripes)" stroke="#94A3B8"/>
  <text x="655" y="605" class="note good">重建结果：原来的细条纹得到保留</text>

  <rect x="50" y="660" width="1100" height="55" rx="12" fill="#EAF1FF"/>
  <text x="600" y="695" class="note" text-anchor="middle">采样是在离散位置取值；采样间隔过大时，重建可能得到并不存在的纹理。</text>
</svg>
