<title id="title-occupancy-resources">占用率：多种资源约束共同决定驻留规模</title>
<desc id="desc-occupancy-resources">展示寄存器、共享内存和槽位约束如何共同决定 SM 的理论驻留块数，并说明占用率与延迟隐藏的关系。</desc>
