<text x="600" y="478" font-family="Consolas,'Liberation Mono',monospace" font-size="18" font-weight="600" fill="#17324D" text-anchor="middle" >占用率 = 活跃 Warp 数 ÷ 硬件最大活跃 Warp 数</text>
