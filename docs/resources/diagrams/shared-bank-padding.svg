<title id="title-shared-bank-padding">Bank 与行尾填充：让列访问分散到不同存储体</title>
<desc id="desc-shared-bank-padding">对比三十二乘三十二共享数组与第二维三十三的填充数组，说明固定列访问如何从同一 Bank 的不同地址变为分散 Bank，并区分同地址广播。</desc>
