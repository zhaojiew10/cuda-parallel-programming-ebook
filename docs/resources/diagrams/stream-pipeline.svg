<text x="172.0" y="746" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#2F6FED" text-anchor="middle" >独立数据块</text>
<rect x="282" y="724" width="220" height="32" rx="16" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="392.0" y="746" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#2F6FED" text-anchor="middle" >页锁定主机缓冲区</text>
<rect x="522" y="724" width="180" height="32" rx="16" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="612.0" y="746" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#2F6FED" text-anchor="middle" >合适的非默认流</text>
<rect x="722" y="724" width="220" height="32" rx="16" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="832.0" y="746" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#2F6FED" text-anchor="middle" >独立或受保护的缓冲区</text>
<text x="600" y="806" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#D98818" text-anchor="middle" >创建多个流不保证实际并发；设备能力、资源占用、依赖和任务粒度仍需用时间线验证。</text>
