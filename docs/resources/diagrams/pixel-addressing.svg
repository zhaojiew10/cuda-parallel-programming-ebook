<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">像素坐标、行主序与行步长</title>
  <desc id="desc">左侧是4列3行灰度矩阵，右侧是每行4个有效字节和4个填充字节的一维缓冲区。像素坐标(2,1)的值为70，对应字节偏移1乘8加2等于10。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:31px;font-weight:700;fill:#17324D}.subtitle{font-size:16px;fill:#5B6B7C}.panel-title{font-size:20px;font-weight:700;fill:#17324D}.label{font-size:15px;fill:#5B6B7C}.cell{font-size:19px;font-weight:600;text-anchor:middle}.small{font-size:13px;fill:#5B6B7C}.formula{font-family:Consolas,monospace;font-size:22px;font-weight:700;fill:#2F6FED;text-anchor:middle}.value{fill:#17324D}.pad{fill:#94A3B8}.accent{fill:#C4750E}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#F6F8FC"/><rect width="1200" height="7" fill="#2F6FED"/>
  <text x="50" y="55" class="title">坐标、行主序与行步长</text>
  <text x="50" y="88" class="subtitle">同一个像素在矩阵中用 (x, y) 定位，在缓冲区中用字节偏移定位</text>

  <rect x="50" y="125" width="405" height="500" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="80" y="165" class="panel-title">① 图像坐标</text>
  <text x="80" y="193" class="label">x 向右，y 向下，均从 0 开始</text>
  <text x="140" y="226" class="small" text-anchor="middle">x=0</text><text x="225" y="226" class="small" text-anchor="middle">x=1</text><text x="310" y="226" class="small" text-anchor="middle">x=2</text><text x="395" y="226" class="small" text-anchor="middle">x=3</text>
  <text x="92" y="270" class="small">y=0</text><text x="92" y="360" class="small">y=1</text><text x="92" y="450" class="small">y=2</text>
  <g stroke="#94A3B8" stroke-width="1.3">
    <rect x="115" y="240" width="70" height="62" fill="#EAF1FF"/><rect x="200" y="240" width="70" height="62" fill="#EAF1FF"/><rect x="285" y="240" width="70" height="62" fill="#EAF1FF"/><rect x="370" y="240" width="70" height="62" fill="#EAF1FF"/>
    <rect x="115" y="330" width="70" height="62" fill="#EAF1FF"/><rect x="200" y="330" width="70" height="62" fill="#EAF1FF"/><rect x="285" y="330" width="70" height="62" fill="#FFF3DE" stroke="#D98818" stroke-width="3"/><rect x="370" y="330" width="70" height="62" fill="#EAF1FF"/>
    <rect x="115" y="420" width="70" height="62" fill="#EAF1FF"/><rect x="200" y="420" width="70" height="62" fill="#EAF1FF"/><rect x="285" y="420" width="70" height="62" fill="#EAF1FF"/><rect x="370" y="420" width="70" height="62" fill="#EAF1FF"/>
  </g>
  <g class="cell value"><text x="150" y="280">10</text><text x="235" y="280">20</text><text x="320" y="280">30</text><text x="405" y="280">40</text><text x="150" y="370">50</text><text x="235" y="370">60</text><text x="320" y="370" class="accent">70</text><text x="405" y="370">80</text><text x="150" y="460">90</text><text x="235" y="460">100</text><text x="320" y="460">110</text><text x="405" y="460">120</text></g>
  <rect x="85" y="515" width="335" height="75" rx="12" fill="#FFF3DE"/>
  <text x="252" y="548" class="panel-title accent" text-anchor="middle">(x=2, y=1)</text><text x="252" y="576" class="label" text-anchor="middle">第 3 列、第 2 行，值为 70</text>

  <rect x="505" y="125" width="645" height="500" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="535" y="165" class="panel-title">② 一维缓冲区（step = 8）</text>
  <text x="535" y="193" class="label">每行 4 个有效字节 + 4 个填充字节</text>
  <text x="535" y="231" class="small">data / hSrc 指向第 0 行首字节</text>
  <g stroke="#94A3B8" stroke-width="1.2">
    <rect x="535" y="250" width="60" height="58" fill="#E8F5EE"/><rect x="595" y="250" width="60" height="58" fill="#E8F5EE"/><rect x="655" y="250" width="60" height="58" fill="#E8F5EE"/><rect x="715" y="250" width="60" height="58" fill="#E8F5EE"/><rect x="775" y="250" width="60" height="58" fill="#EEF2F6"/><rect x="835" y="250" width="60" height="58" fill="#EEF2F6"/><rect x="895" y="250" width="60" height="58" fill="#EEF2F6"/><rect x="955" y="250" width="60" height="58" fill="#EEF2F6"/>
    <rect x="535" y="360" width="60" height="58" fill="#E8F5EE"/><rect x="595" y="360" width="60" height="58" fill="#E8F5EE"/><rect x="655" y="360" width="60" height="58" fill="#FFF3DE" stroke="#D98818" stroke-width="3"/><rect x="715" y="360" width="60" height="58" fill="#E8F5EE"/><rect x="775" y="360" width="60" height="58" fill="#EEF2F6"/><rect x="835" y="360" width="60" height="58" fill="#EEF2F6"/><rect x="895" y="360" width="60" height="58" fill="#EEF2F6"/><rect x="955" y="360" width="60" height="58" fill="#EEF2F6"/>
    <rect x="535" y="470" width="60" height="58" fill="#E8F5EE"/><rect x="595" y="470" width="60" height="58" fill="#E8F5EE"/><rect x="655" y="470" width="60" height="58" fill="#E8F5EE"/><rect x="715" y="470" width="60" height="58" fill="#E8F5EE"/><rect x="775" y="470" width="60" height="58" fill="#EEF2F6"/><rect x="835" y="470" width="60" height="58" fill="#EEF2F6"/><rect x="895" y="470" width="60" height="58" fill="#EEF2F6"/><rect x="955" y="470" width="60" height="58" fill="#EEF2F6"/>
  </g>
  <g class="cell value"><text x="565" y="287">10</text><text x="625" y="287">20</text><text x="685" y="287">30</text><text x="745" y="287">40</text><text x="565" y="397">50</text><text x="625" y="397">60</text><text x="685" y="397" class="accent">70</text><text x="745" y="397">80</text><text x="565" y="507">90</text><text x="625" y="507">100</text><text x="685" y="507">110</text><text x="745" y="507">120</text></g>
  <g class="cell pad"><text x="805" y="287">·</text><text x="865" y="287">·</text><text x="925" y="287">·</text><text x="985" y="287">·</text><text x="805" y="397">·</text><text x="865" y="397">·</text><text x="925" y="397">·</text><text x="985" y="397">·</text><text x="805" y="507">·</text><text x="865" y="507">·</text><text x="925" y="507">·</text><text x="985" y="507">·</text></g>
  <text x="1025" y="285" class="small">偏移 0</text><text x="1025" y="395" class="small">偏移 8</text><text x="1025" y="505" class="small">偏移 16</text>
  <rect x="535" y="555" width="480" height="42" rx="10" fill="#EEF2F6"/><text x="555" y="583" class="label">灰色区域是行尾填充，不是像素</text>
  <path d="M440 361 C490 361 595 361 650 389" fill="none" stroke="#2F6FED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="50" y="650" width="1100" height="70" rx="14" fill="#EAF1FF"/>
  <text x="600" y="695" class="formula">offset = y × step + x = 1 × 8 + 2 = 10</text>
</svg>
