<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title-event-dag desc-event-dag">
<title id="title-event-dag">事件 DAG：只连接真正需要的数据依赖</title>
<desc id="desc-event-dag">两个生产流分别在数据生产完成后记录事件，消费流等待这两个事件再执行核函数；无关任务不加入等待集合，形成有向任务图。</desc>
<defs>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7C"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B68"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D98818"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C94F55"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7556B3"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168C8C"/></marker>
</defs>
<rect width="1200" height="930" fill="#F6F8FC"/>
<rect width="1200" height="8" fill="#2F6FED"/>
<text x="60" y="46" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="start" >第 21 章 · 同步范围、事件计时与跨流依赖</text>
<text x="60" y="92" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" >事件 DAG：只连接真正需要的数据依赖</text>
<text x="60" y="126" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="start" >实线表示流内顺序，紫色虚线表示“记录事件 → 其他流等待”</text>
<rect x="60" y="154" width="1080" height="612" rx="14" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="82" y="190" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="start" >流 A · 生产者</text>
<rect x="230" y="170" width="160" height="66" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5" />
<text x="310.0" y="197" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2F6FED" text-anchor="middle" >准备输入 A</text>
<text x="310.0" y="221" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >H2D A</text>
<rect x="470" y="170" width="170" height="66" rx="10" fill="#E8F5EE" stroke="#2E8B68" stroke-width="1.5" />
<text x="555.0" y="197" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2E8B68" text-anchor="middle" >生成数据 A</text>
<text x="555.0" y="221" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >Producer A</text>
<line x1="390" y1="203" x2="460" y2="203" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<line x1="640" y1="203" x2="748" y2="203" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<circle cx="790" cy="203" r="34" fill="#F1ECFA" stroke="#7556B3" stroke-width="2"/>
<text x="790" y="209" font-family="Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#7556B3" text-anchor="middle" >E_A</text>
<text x="790" y="259" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="600" fill="#7556B3" text-anchor="middle" >cudaEventRecord · 数据 A 就绪</text>
<text x="82" y="340" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="start" >流 B · 生产者</text>
<rect x="230" y="320" width="160" height="66" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5" />
<text x="310.0" y="347" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2F6FED" text-anchor="middle" >准备输入 B</text>
<text x="310.0" y="371" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >H2D B</text>
<rect x="470" y="320" width="170" height="66" rx="10" fill="#E8F5EE" stroke="#2E8B68" stroke-width="1.5" />
<text x="555.0" y="347" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2E8B68" text-anchor="middle" >生成数据 B</text>
<text x="555.0" y="371" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >Producer B</text>
<line x1="390" y1="353" x2="460" y2="353" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<line x1="640" y1="353" x2="748" y2="353" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<circle cx="790" cy="353" r="34" fill="#F1ECFA" stroke="#7556B3" stroke-width="2"/>
<text x="790" y="359" font-family="Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#7556B3" text-anchor="middle" >E_B</text>
<text x="790" y="409" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="600" fill="#7556B3" text-anchor="middle" >cudaEventRecord · 数据 B 就绪</text>
<path d="M 770 232 C 690 410, 560 420, 488 526" fill="none" stroke="#7556B3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
<path d="M 770 382 C 700 470, 610 462, 530 526" fill="none" stroke="#7556B3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
<text x="82" y="553" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="start" >流 C · 消费者</text>
<rect x="370" y="526" width="200" height="76" rx="10" fill="#F1ECFA" stroke="#7556B3" stroke-width="1.5" />
<text x="470.0" y="553" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#7556B3" text-anchor="middle" >等待 E_A 与 E_B</text>
<text x="470.0" y="577" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >cudaStreamWaitEvent</text>
<rect x="660" y="526" width="180" height="76" rx="10" fill="#E8F5EE" stroke="#2E8B68" stroke-width="1.5" />
<text x="750.0" y="553" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2E8B68" text-anchor="middle" >消费 A 与 B</text>
<text x="750.0" y="577" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >Consumer</text>
<rect x="930" y="526" width="150" height="76" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.5" />
<text x="1005.0" y="553" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#2F6FED" text-anchor="middle" >写回结果</text>
<text x="1005.0" y="577" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >D2H</text>
<line x1="570" y1="564" x2="650" y2="564" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<line x1="840" y1="564" x2="920" y2="564" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<text x="82" y="682" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="start" >流 D · 无关任务</text>
<rect x="470" y="650" width="170" height="62" rx="10" fill="#EEF2F6" stroke="#5B6B7C" stroke-width="1.5" />
<text x="555.0" y="677" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#5B6B7C" text-anchor="middle" >独立任务 X</text>
<text x="555.0" y="701" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >Kernel X</text>
<rect x="780" y="650" width="170" height="62" rx="10" fill="#EEF2F6" stroke="#5B6B7C" stroke-width="1.5" />
<text x="865.0" y="677" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="15" font-weight="700" fill="#5B6B7C" text-anchor="middle" >独立任务 Y</text>
<text x="865.0" y="701" font-family="Consolas,'Liberation Mono',monospace" font-size="11" font-weight="500" fill="#5B6B7C" text-anchor="middle" >Kernel Y</text>
<line x1="640" y1="681" x2="770" y2="681" stroke="#5B6B7C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<text x="1000" y="686" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="600" fill="#5B6B7C" text-anchor="start" >无需等待 E_A / E_B</text>
<rect x="60" y="792" width="1080" height="52" rx="14" fill="#FFF3DE" stroke="#D98818" stroke-width="1.4" />
<text x="82" y="817" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="700" fill="#D98818" text-anchor="start" >事件应记录在数据生产完成之后；cudaStreamWaitEvent 把等待提交到消费流，主机无需在此阻塞。</text>
<text x="82" y="838" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="12" font-weight="400" fill="#5B6B7C" text-anchor="start" >事件也可标记设备时间线用于计时；保留必要边，避免全设备同步引入无关等待。</text>
<line x1="60" y1="868" x2="1140" y2="868" stroke="#CBD6E2" stroke-width="1.3" stroke-linecap="round"/>
<text x="60" y="903" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6B7C" text-anchor="start" >图例</text>
<rect x="125" y="887" width="16" height="16" rx="4" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="149" y="901" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >流内任务与实线顺序</text>
<rect x="318" y="887" width="16" height="16" rx="4" fill="#F1ECFA" stroke="none" stroke-width="0" />
<text x="342" y="901" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >事件及跨流虚线依赖</text>
<rect x="511" y="887" width="16" height="16" rx="4" fill="#E8F5EE" stroke="none" stroke-width="0" />
<text x="535" y="901" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >数据生产与消费</text>
<rect x="674" y="887" width="16" height="16" rx="4" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="698" y="901" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >依赖范围说明</text>
</svg>
