<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">主机与设备可以有不同的行步长</title>
  <desc id="desc">主机cv::Mat的hSrcStep为8，设备cudaMallocPitch返回的dSrcStep示例为32。cudaMemcpy2D每行只复制4个有效字节。同一像素(2,1)在主机中的偏移为10，在设备中的偏移为34。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2F6FED"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#17324D}.subtitle{font-size:16px;fill:#5B6B7C}.panel-title{font-size:20px;font-weight:700;fill:#17324D}.label{font-size:14px;fill:#5B6B7C}.cell{font-size:18px;font-weight:600;text-anchor:middle;fill:#17324D}.small{font-size:13px;fill:#5B6B7C}.formula{font-family:Consolas,monospace;font-size:19px;font-weight:700;fill:#2F6FED;text-anchor:middle}.accent{fill:#C4750E}</style>
  </defs>
  <rect width="1200" height="820" fill="#F6F8FC"/><rect width="1200" height="7" fill="#2F6FED"/>
  <text x="50" y="55" class="title">主机与设备可以有不同的行步长</text>
  <text x="50" y="88" class="subtitle">复制的是相同的有效像素，不要求主机与设备使用相同的行尾填充</text>
  <rect x="45" y="125" width="510" height="525" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="75" y="166" class="panel-title">主机：cv::Mat</text>
  <text x="75" y="196" class="label">hSrc = image.data</text><text x="75" y="220" class="label">hSrcStep = 8</text>
  <text x="75" y="255" class="small">第 0 行（偏移 0）</text><text x="75" y="365" class="small">第 1 行（偏移 8）</text><text x="75" y="475" class="small">第 2 行（偏移 16）</text>
  <g stroke="#94A3B8" stroke-width="1.2">
    <rect x="75" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="123" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="171" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="219" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="267" y="270" width="48" height="55" fill="#EEF2F6"/><rect x="315" y="270" width="48" height="55" fill="#EEF2F6"/><rect x="363" y="270" width="48" height="55" fill="#EEF2F6"/><rect x="411" y="270" width="48" height="55" fill="#EEF2F6"/>
    <rect x="75" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="123" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="171" y="380" width="48" height="55" fill="#FFF3DE" stroke="#D98818" stroke-width="3"/><rect x="219" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="267" y="380" width="48" height="55" fill="#EEF2F6"/><rect x="315" y="380" width="48" height="55" fill="#EEF2F6"/><rect x="363" y="380" width="48" height="55" fill="#EEF2F6"/><rect x="411" y="380" width="48" height="55" fill="#EEF2F6"/>
    <rect x="75" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="123" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="171" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="219" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="267" y="490" width="48" height="55" fill="#EEF2F6"/><rect x="315" y="490" width="48" height="55" fill="#EEF2F6"/><rect x="363" y="490" width="48" height="55" fill="#EEF2F6"/><rect x="411" y="490" width="48" height="55" fill="#EEF2F6"/>
  </g>
  <g class="cell"><text x="99" y="305">10</text><text x="147" y="305">20</text><text x="195" y="305">30</text><text x="243" y="305">40</text><text x="99" y="415">50</text><text x="147" y="415">60</text><text x="195" y="415" class="accent">70</text><text x="243" y="415">80</text><text x="99" y="525">90</text><text x="147" y="525">100</text><text x="195" y="525">110</text><text x="243" y="525">120</text></g>
  <text x="75" y="585" class="label">每行：4 个有效字节 + 4 个填充字节</text><text x="75" y="615" class="small">像素 (2,1) 的主机偏移 = 1 × 8 + 2 = 10</text>

  <rect x="645" y="125" width="510" height="525" rx="16" fill="#FFFFFF" stroke="#CBD6E2"/>
  <text x="675" y="166" class="panel-title">设备：cudaMallocPitch</text>
  <text x="675" y="196" class="label">dSrc = 设备缓冲区首地址</text><text x="675" y="220" class="label">dSrcStep = 32（示例值）</text>
  <text x="675" y="255" class="small">第 0 行（偏移 0）</text><text x="675" y="365" class="small">第 1 行（偏移 32）</text><text x="675" y="475" class="small">第 2 行（偏移 64）</text>
  <g stroke="#94A3B8" stroke-width="1.2">
    <rect x="675" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="723" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="771" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="819" y="270" width="48" height="55" fill="#E8F5EE"/><rect x="867" y="270" width="240" height="55" fill="#EEF2F6"/>
    <rect x="675" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="723" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="771" y="380" width="48" height="55" fill="#FFF3DE" stroke="#D98818" stroke-width="3"/><rect x="819" y="380" width="48" height="55" fill="#E8F5EE"/><rect x="867" y="380" width="240" height="55" fill="#EEF2F6"/>
    <rect x="675" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="723" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="771" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="819" y="490" width="48" height="55" fill="#E8F5EE"/><rect x="867" y="490" width="240" height="55" fill="#EEF2F6"/>
  </g>
  <g class="cell"><text x="699" y="305">10</text><text x="747" y="305">20</text><text x="795" y="305">30</text><text x="843" y="305">40</text><text x="699" y="415">50</text><text x="747" y="415">60</text><text x="795" y="415" class="accent">70</text><text x="843" y="415">80</text><text x="699" y="525">90</text><text x="747" y="525">100</text><text x="795" y="525">110</text><text x="843" y="525">120</text></g>
  <text x="675" y="585" class="label">每行：4 个有效字节 + 28 个填充字节</text><text x="675" y="615" class="small">像素 (2,1) 的设备偏移 = 1 × 32 + 2 = 34</text>

  <path d="M465 297 C540 297 600 297 668 297" fill="none" stroke="#2F6FED" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M465 407 C540 407 600 407 668 407" fill="none" stroke="#2F6FED" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M465 517 C540 517 600 517 668 517" fill="none" stroke="#2F6FED" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="600" y="682" class="panel-title" text-anchor="middle" fill="#2F6FED">cudaMemcpy2D：每行复制 rowBytes = 4 字节</text>
  <rect x="45" y="725" width="1110" height="90" rx="14" fill="#EAF1FF"/>
  <text x="600" y="760" class="formula">同一像素：主机偏移 10，设备偏移 34</text><text x="600" y="790" class="label" text-anchor="middle">dSrcStep 由 cudaMallocPitch 返回，不能凭 width 猜测</text>
</svg>
