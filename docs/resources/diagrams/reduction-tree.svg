<text x="273.0" y="590" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 4 轮</text>
