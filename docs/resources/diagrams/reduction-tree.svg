<text x="660" y="391" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 32)</text>
<text x="660" y="411" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 32]</text>
