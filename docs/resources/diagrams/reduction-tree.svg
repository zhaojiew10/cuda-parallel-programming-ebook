<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title-reduction-tree desc-reduction-tree">
<title id="title-reduction-tree">树形归约：每一轮都把有效部分和减半</title>
<desc id="desc-reduction-tree">完整展示一百二十八项经过六十四、三十二、十六、八、四、二到一项的七轮连续线程树形归约，每轮明确配对位置和轮后同步。</desc>
<defs>
<marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B7C"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B68"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D98818"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C94F55"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7556B3"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#168C8C"/></marker>
</defs>
<rect width="1200" height="1000" fill="#F6F8FC"/>
<rect width="1200" height="8" fill="#2F6FED"/>
<text x="60" y="46" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#2F6FED" text-anchor="start" >第 10 章 · 并行归约与连续线程映射</text>
<text x="60" y="92" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" >树形归约：每一轮都把有效部分和减半</text>
<text x="60" y="126" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="start" >128 → 64 → 32 → 16 → 8 → 4 → 2 → 1（逐轮展示，不跳步）</text>
<rect x="60" y="154" width="1080" height="84" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.4" />
<text x="84" y="185" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="700" fill="#2F6FED" text-anchor="start" >连续线程映射：第 k 轮只让前半区间参与更新</text>
<text x="84" y="215" font-family="Consolas,'Liberation Mono',monospace" font-size="16" font-weight="500" fill="#17324D" text-anchor="start" >for (stride = 64; stride &gt; 0; stride &gt;&gt;= 1)  →  每轮后 __syncthreads()</text>
<rect x="60" y="266" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="310" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >128 → 64</text>
<rect x="232" y="286" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="308" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 1 轮</text>
<rect x="342" y="278" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="308" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 64)  →  data[i]</text>
<line x1="604" y1="302" x2="640" y2="302" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="297" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 64)</text>
<text x="660" y="317" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 64]</text>
<rect x="984" y="286" width="128" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="1048.0" y="308" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="338" x2="120" y2="358" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="360" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="404" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >64 → 32</text>
<rect x="232" y="380" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="402" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 2 轮</text>
<rect x="342" y="372" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="402" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 32)  →  data[i]</text>
