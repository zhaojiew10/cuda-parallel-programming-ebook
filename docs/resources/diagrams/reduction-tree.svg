<text x="149" y="971" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >本轮配对与活跃前缀</text>
<rect x="318" y="957" width="16" height="16" rx="4" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="342" y="971" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="start" >轮次之间的块内同步</text>
