<text x="467" y="590" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 8)  →  data[i]</text>
<line x1="604" y1="584" x2="640" y2="584" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="579" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 8)</text>
<text x="660" y="599" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 8]</text>
<rect x="984" y="568" width="128" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="1048.0" y="590" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="620" x2="120" y2="640" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="642" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="686" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >8 → 4</text>
<rect x="232" y="662" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="684" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 5 轮</text>
<rect x="342" y="654" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="684" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 4)  →  data[i]</text>
<line x1="604" y1="678" x2="640" y2="678" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="673" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 4)</text>
<text x="660" y="693" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 4]</text>
<rect x="984" y="662" width="128" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="1048.0" y="684" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="714" x2="120" y2="734" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="736" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="780" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >4 → 2</text>
<rect x="232" y="756" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="778" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 6 轮</text>
<rect x="342" y="748" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="778" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 2)  →  data[i]</text>
<line x1="604" y1="772" x2="640" y2="772" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="767" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 2)</text>
<text x="660" y="787" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 2]</text>
<rect x="984" y="756" width="128" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="1048.0" y="778" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="808" x2="120" y2="828" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="830" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="874" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >2 → 1</text>
<rect x="232" y="850" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="872" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 7 轮</text>
<rect x="342" y="842" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="872" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 1)  →  data[i]</text>
<line x1="604" y1="866" x2="640" y2="866" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="861" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 1)</text>
<text x="660" y="881" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 1]</text>
<rect x="964" y="850" width="148" height="32" rx="16" fill="#E8F5EE" stroke="none" stroke-width="0" />
<text x="1038.0" y="872" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#2E8B68" text-anchor="middle" >同步 → data[0]</text>
<text x="600" y="934" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="400" fill="#5B6B7C" text-anchor="middle" >配对只在当前轮进行；同步保证下一轮读取到本轮已经完成的部分和。</text>
<line x1="60" y1="938" x2="1140" y2="938" stroke="#CBD6E2" stroke-width="1.3" stroke-linecap="round"/>
<text x="60" y="973" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6B7C" text-anchor="start" >图例</text>
