<text x="1048.0" y="402" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="432" x2="120" y2="452" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="454" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="498" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >32 → 16</text>
<rect x="232" y="474" width="82" height="32" rx="16" fill="#EEF2F6" stroke="none" stroke-width="0" />
<text x="273.0" y="496" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6B7C" text-anchor="middle" >第 3 轮</text>
<rect x="342" y="466" width="250" height="48" rx="9" fill="#EAF1FF" stroke="none" stroke-width="0" />
<text x="467" y="496" font-family="Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#2F6FED" text-anchor="middle" >(i) + (i + 16)  →  data[i]</text>
<line x1="604" y1="490" x2="640" y2="490" stroke="#2F6FED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="660" y="485" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#5B6B7C" text-anchor="start" >if (tid &lt; 16)</text>
<text x="660" y="505" font-family="Consolas,'Liberation Mono',monospace" font-size="13" font-weight="500" fill="#17324D" text-anchor="start" >data[tid] += data[tid + 16]</text>
<rect x="984" y="474" width="128" height="32" rx="16" fill="#FFF3DE" stroke="none" stroke-width="0" />
<text x="1048.0" y="496" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="13" font-weight="600" fill="#D98818" text-anchor="middle" >轮后同步</text>
<line x1="120" y1="526" x2="120" y2="546" stroke="#5B6B7C" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
<rect x="60" y="548" width="1080" height="72" rx="12" fill="#FFFFFF" stroke="#CBD6E2" stroke-width="1.4" />
<text x="84" y="592" font-family="Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#2F6FED" text-anchor="start" >16 → 8</text>
