<text x="60" y="92" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="start" >并行 Compact：谓词 → 排他扫描 → 稳定散射</text>
<text x="60" y="126" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6B7C" text-anchor="start" >示例保留大于 0 的元素；排他前缀给出每个保留元素的唯一输出位置</text>
<rect x="60" y="154" width="1080" height="74" rx="14" fill="#EAF1FF" stroke="#2F6FED" stroke-width="1.4" />
<text x="84" y="183" font-family="Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#2F6FED" text-anchor="start" >keep(i) = input[i] &gt; 0</text>
<text x="420" y="183" font-family="Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#2F6FED" text-anchor="start" >position = exclusive_scan(keep)</text>
<text x="84" y="211" font-family="Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#17324D" text-anchor="start" >if (keep(i))  output[position[i]] = input[i]</text>
